<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#f8fafc">cc-relay-hub cross-node: agents on different computers, one command</text>
  <text x="600" y="86" text-anchor="middle" font-size="17" fill="#94a3b8">Each computer runs one node daemon. Messages are encrypted end to end; the rendezvous server only ever sees ciphertext.</text>

  <!-- Home computer -->
  <g transform="translate(60,130)">
    <rect width="330" height="300" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/>
    <text x="165" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">Home laptop · node "mbp"</text>
    <text x="165" y="58" text-anchor="middle" font-size="13" fill="#64748b">NAT · Wi-Fi · no open ports</text>
    <rect x="30" y="80" width="120" height="58" rx="12" fill="#1d4ed8"/>
    <text x="90" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Claude Code</text>
    <text x="90" y="124" text-anchor="middle" font-size="12" fill="#bfdbfe">claude-bot</text>
    <rect x="180" y="80" width="120" height="58" rx="12" fill="#0f766e"/>
    <text x="240" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Codex</text>
    <text x="240" y="124" text-anchor="middle" font-size="12" fill="#99f6e4">codex-bot</text>
    <path d="M90,138 V170 M240,138 V170" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="170" width="270" height="92" rx="14" fill="#f59e0b"/>
    <text x="165" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">node daemon :9130</text>
    <text x="165" y="226" text-anchor="middle" font-size="12" fill="#422006">busy-check · marker ack · durable outbox</text>
    <text x="165" y="246" text-anchor="middle" font-size="12" fill="#422006">encrypt + sign everything that leaves</text>
  </g>

  <!-- Office computer -->
  <g transform="translate(810,130)">
    <rect width="330" height="300" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/>
    <text x="165" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">Office desktop · node "office"</text>
    <text x="165" y="58" text-anchor="middle" font-size="13" fill="#64748b">different network · Windows or macOS</text>
    <rect x="30" y="80" width="120" height="58" rx="12" fill="#0f766e"/>
    <text x="90" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Codex</text>
    <text x="90" y="124" text-anchor="middle" font-size="12" fill="#99f6e4">codex-bot</text>
    <rect x="180" y="80" width="120" height="58" rx="12" fill="#7c3aed"/>
    <text x="240" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Gemini CLI</text>
    <text x="240" y="124" text-anchor="middle" font-size="12" fill="#ddd6fe">gemini-bot</text>
    <path d="M90,138 V170 M240,138 V170" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="170" width="270" height="92" rx="14" fill="#f59e0b"/>
    <text x="165" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#1c1917">node daemon :9130</text>
    <text x="165" y="226" text-anchor="middle" font-size="12" fill="#422006">delivers to the local agent session</text>
    <text x="165" y="246" text-anchor="middle" font-size="12" fill="#422006">reply goes back the same way</text>
  </g>

  <!-- Rendezvous cloud -->
  <g transform="translate(600,215)">
    <ellipse cx="0" cy="0" rx="118" ry="52" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">rendezvous / relay</text>
    <text x="0" y="12" text-anchor="middle" font-size="12" fill="#94a3b8">ntfy.sh or self-hosted</text>
    <text x="0" y="30" text-anchor="middle" font-size="12" fill="#fbbf24">sees only ciphertext</text>
  </g>

  <!-- Relay path -->
  <path d="M390,345 C470,345 500,240 482,230" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M718,230 C700,240 730,345 810,345" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="300" text-anchor="middle" font-size="13" fill="#fbbf24">③ relay path · always works · only outbound HTTPS needed · 1-3 s</text>

  <!-- Direct path -->
  <path d="M390,395 L810,395" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrowg)" marker-start="url(#arrowg)"/>
  <text x="600" y="385" text-anchor="middle" font-size="13" fill="#34d399">①② direct path · same LAN or any reachable address · auto-upgraded, &lt; 50 ms</text>

  <!-- Command strip -->
  <rect x="60" y="460" width="1080" height="70" rx="14" fill="#020617" stroke="#334155"/>
  <text x="84" y="489" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#e2e8f0">$ cc-relay-hub send codex-bot@office "implement the plan and run the tests"</text>
  <text x="84" y="515" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#34d399">Message sent to codex-bot@office (request_id=… via=relay)   → reply returns to this conversation</text>
</svg>
